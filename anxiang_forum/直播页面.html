const g = block(xml, 'image_gallery'); const gr = /\[图片\|([^\]]+)\]/g; let m;

/* ---------- 弹幕 ---------- */
function spawnDanmaku(text) {
const stage = document.getElementById('stage'); if (!stage || !danmakuOn) return;
if (stage.querySelectorAll('.danmaku').length > 8) return;
const el = document.createElement('div'); el.className = 'danmaku'; el.textContent = text;
el.style.top = (22 + Math.floor(Math.random() * 4) * 26) + 'px';
el.style.animationDuration = (9 + Math.random() * 6) + 's';
el.addEventListener('animationend', () => el.remove());
stage.appendChild(el);
}
function startDanmaku() {
if (danmakuTimer) clearInterval(danmakuTimer);
if (!S.danmaku.length) return;
danmakuTimer = setInterval(() => { spawnDanmaku(S.danmaku[danmakuIdx % S.danmaku.length]); danmakuIdx++; }, 1100);
}
function toggleDanmaku() {
danmakuOn = !danmakuOn;
document.getElementById('dm-toggle').textContent = '弹幕:' + (danmakuOn ? '开' : '关');
if (!danmakuOn) document.querySelectorAll('.danmaku').forEach((e) => e.remove());
}
/* ---------- 指令 ---------- */
function sendCmd(cmd) { if (typeof triggerSlash === 'function') { triggerSlash(cmd); } }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
function goList() { sendCmd('/send 查看直播列表 | /trigger'); }
function sendDanmaku() {
const input = document.getElementById('dm-input'); const text = input.value.trim(); if (!text) return;
spawnDanmaku(text); input.value = '';
sendCmd(`/send 发送弹幕:${text.replace(/\|/g, '｜')} | /trigger`);
}
/* ---------- 弹窗 ---------- */
function openModal(html) { document.getElementById('modal').innerHTML = html; document.getElementById('modal-mask').classList.add('show'); }
function closeModal() { document.getElementById('modal-mask').classList.remove('show'); }
function freeMax() { const p = planOf(S.vip); return p ? p.maxIdx : -1; }
function giftList() {
const tier = GIFT_TIERS[activeTier];
const freeOk = !tier.virtual && S.free > 0 && activeTier <= freeMax();
return tier.items.map((it, i) => `<div class="gift-item"><div class="gname">${esc(it[0])}</div><div class="gprice">${it[1]}积分</div><button class="btn ${freeOk ? 'primary' : ''}" onclick="giveGift(${activeTier},${i},${freeOk})">${freeOk ? '免费' : '邀约'}</button></div>`).join('');
}
function openGift() {
const tabs = GIFT_TIERS.map((t, i) => `<button class="tier-tab ${i === activeTier ? 'active' : ''}" onclick="switchTier(${i})">${esc(t.name)}</button>`).join('');
openModal(`<h3>🎁 邀约 / 礼物</h3><div class="hint">邀约由主播自愿决定是否回应,婉拒则积分原路退还。当前积分 ${S.points},免费邀约剩余 ${S.free}。</div><div class="tier-tabs">${tabs}</div><div id="gift-list">${giftList()}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}
function switchTier(i) { activeTier = i; openGift(); }
function giveGift(ti, ii, free) {
const tier = GIFT_TIERS[ti]; const it = tier.items[ii];
if (free) {
sendCmd(`/send 使用免费额度赠送礼物:${it[0]} | /trigger`);
S.free = Math.max(0, S.free - 1); const f = document.getElementById('free'); if (f) f.textContent = S.free;
closeModal(); toast('已发出免费邀约'); return;
}
if (it[1] > S.points) { toast('积分不足'); return; }
const cmd = tier.virtual ? `赠送虚拟的情趣礼物:${it[0]}(${it[1]}积分)` : `赠送礼物:${it[0]}(${it[1]}积分)`;
sendCmd(`/send ${cmd} | /trigger`);
S.points -= it[1]; const p = document.getElementById('points'); if (p) p.textContent = S.points;
closeModal(); toast('邀约已发出');
}
function openSubscribe() {
const html = SUBSCRIBE_PLANS.map((p) => `<div class="plan"><b>${p.tier}</b> · ${p.price}积分/30天<div class="hint" style="margin:4px 0">${esc(p.perk)}</div><button class="btn primary" ${S.vip === p.tier ? 'disabled' : ''} onclick="subscribe('${p.tier}')">${S.vip === p.tier ? '已订阅' : '订阅'}</button></div>`).join('');
openModal(`<h3>💎 包月订阅</h3><div class="hint">订阅为心意支持,不改变主播的自愿原则。积分只用于论坛内解锁,不可兑现。</div>${html}<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}
function subscribe(tier) {
const p = planOf(tier); if (p.price > S.points) { toast('积分不足'); return; }
sendCmd(`/send 购买月度订阅:${tier} | /trigger`); closeModal(); toast('已发出订阅请求');
}
function openView() {
const p = planOf(S.vip);
if (!p || !p.views.length) { openModal(`<h3>📹 视角</h3><div class="hint">切换视角需要「常客」或「知音」订阅。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`); return; }
const btns = p.views.map((v) => `<button class="btn" style="margin:4px" onclick="requestView('${v}')">${v}</button>`).join('');
openModal(`<h3>📹 请求切换视角</h3><div class="hint">主播可自愿决定是否切换。</div><div>${btns}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}
function requestView(v) { sendCmd(`/send 请求切换视角:${v} | /trigger`); closeModal(); toast('已发出视角请求'); }
function openPM() {
const p = planOf(S.vip);
if (!p || !p.pm) { openModal(`<h3>✉ 私信主播</h3><div class="hint">私信主播需要「常客」或「知音」订阅。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`); return; }
openModal(`<h3>✉ 私信主播</h3><div class="hint">请保持友善与尊重,不要追问身份或联系方式。</div><textarea id="pm-text" maxlength="200" placeholder="想对他说点什么…"></textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="sendPM()">发送</button></div>`);
}
function sendPM() {
const t = document.getElementById('pm-text').value.trim(); if (!t) return;
sendCmd(`/send 向主播发私信:${t.replace(/\|/g, '｜')} | /trigger`); closeModal(); toast('私信已发送');
}
/* ---------- 主题与字号 ---------- */
function toggleTheme() {
const body = document.body; const icon = document.getElementById('theme-icon');
if (body.getAttribute('data-theme') === 'light') { body.removeAttribute('data-theme'); icon.textContent = '🌙'; localStorage.setItem('forum-theme', 'dark'); }
else { body.setAttribute('data-theme', 'light'); icon.textContent = '☀️'; localStorage.setItem('forum-theme', 'light'); }
}
function toggleFontSize() {
const sizes = ['small', 'medium', 'large', 'xlarge']; const icons = ['A', 'A+', 'A++', 'A+++'];
const room = document.getElementById('room'); const cur = localStorage.getItem('forum-font-size') || 'small';
const next = sizes[(sizes.indexOf(cur) + 1) % sizes.length];
room.classList.remove('font-medium', 'font-large', 'font-xlarge'); if (next !== 'small') room.classList.add('font-' + next);
document.getElementById('font-size-icon').textContent = icons[sizes.indexOf(next)]; localStorage.setItem('forum-font-size', next);
}
function syncFromStorage(e) {
const icon = document.getElementById('theme-icon');
if (e.key === 'forum-theme') { if (e.newValue === 'light') { document.body.setAttribute('data-theme', 'light'); if (icon) icon.textContent = '☀️'; } else { document.body.removeAttribute('data-theme'); if (icon) icon.textContent = '🌙'; } }
if (e.key === 'forum-font-size') {
const room = document.getElementById('room'); const sizes = ['small', 'medium', 'large', 'xlarge']; const icons = ['A', 'A+', 'A++', 'A+++'];
room.classList.remove('font-medium', 'font-large', 'font-xlarge'); if (e.newValue && e.newValue !== 'small') room.classList.add('font-' + e.newValue);
const fi = document.getElementById('font-size-icon'); if (fi) fi.textContent = icons[sizes.indexOf(e.newValue || 'small')];
}
}
window.addEventListener('storage', syncFromStorage);
setTimeout(function () {
try {
S = parseLiveRoomXML(liveRoomXML);
renderRoom();
const theme = localStorage.getItem('forum-theme');
if (theme === 'light') { document.body.setAttribute('data-theme', 'light'); document.getElementById('theme-icon').textContent = '☀️'; }
const fs = localStorage.getItem('forum-font-size') || 'small'; const sizes = ['small', 'medium', 'large', 'xlarge']; const icons = ['A', 'A+', 'A++', 'A+++'];
if (fs !== 'small') document.getElementById('room').classList.add('font-' + fs);
document.getElementById('font-size-icon').textContent = icons[sizes.indexOf(fs)];
} catch (error) {
console.error('渲染失败:', error);
document.getElementById('room').innerHTML = '<div class="loading">数据加载失败,请刷新重试</div>';
}
}, 0);
</script>
